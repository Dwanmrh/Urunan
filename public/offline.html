<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <title>Offline - Udunan</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; background: #fafafa; color: #18181b; }
        @media (prefers-color-scheme: dark) { body { background: #18181b; color: #fafafa; } p { color: #d4d4d8 !important; } }
        .kartu { max-width: 360px; text-align: center; }
        .ikon { width: 72px; height: 72px; border-radius: 20px; }
        h1 { font-size: 22px; margin: 20px 0 8px; }
        p { margin: 0 0 24px; color: #52525b; line-height: 1.5; }
        button { border: 0; border-radius: 12px; padding: 12px 20px; font: inherit; font-weight: 600; color: #fff; background: #4f46e5; cursor: pointer; }
    </style>
</head>
<body>
    <div class="kartu">
        <img class="ikon" src="/ikon/ikon-192.png" alt="">
        <h1>Kamu sedang offline 📡</h1>
        <p>Udunan butuh internet supaya data tagihan selalu terbaru. Cek koneksimu, lalu coba lagi.<br><br><span lang="en">You're offline. Check your connection and try again.</span></p>
        <button type="button" onclick="location.reload()">Coba lagi</button>
    </div>
</body>
</html>
